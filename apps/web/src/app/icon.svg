<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="wordbands">
  <rect width="32" height="32" rx="7" fill="#0b1220"/>
  <!-- Three bars, longest to shortest: a vocabulary ordered by frequency. -->
  <rect x="7" y="8"  width="18" height="4" rx="2" fill="#7cc4ff"/>
  <rect x="7" y="14" width="12" height="4" rx="2" fill="#7cc4ff" opacity=".72"/>
  <rect x="7" y="20" width="7"  height="4" rx="2" fill="#7cc4ff" opacity=".45"/>
</svg>
