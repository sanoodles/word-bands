name: PR checks

# Pull requests, and pushes to main.
#
# A PR is where this earns its keep, because it reports before the merge. The gap it
# fills there is the Dependabot PR merged from the GitHub UI, which never touches
# .githooks/pre-push, and a dependency bump is exactly where a silent behaviour change
# hides.
#
# Pushing to main reports after the deploy, which is worse than a PR and better than the
# nothing that was here before. Branch protection's required `check` only reports from a
# pull_request event, so a direct push to main is bypassed with a warning and gets no run
# at all. The hook is the only other gate, and it is opt-in per clone
# (`git config core.hooksPath .githooks`) and skipped by --no-verify — so on a fresh clone
# or a second machine, untested code reached production with nothing run.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new commit on the PR makes the run in flight irrelevant. A push to main does not
# work that way: keying those by sha lets a run of pushes check every commit in parallel,
# rather than each one cancelling the verdict on the one before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `check` is load-bearing beyond this file: branch protection on main requires a status
  # check by that exact name. Renaming the job does not fail anything — the required check
  # simply never reports again, which leaves every PR waiting on a gate that cannot pass.
  # Rename it only together with the rule in Settings → Branches.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the root package.json `packageManager` field, so this
      # cannot drift from what the repo actually builds with.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Before the install, because it parses text and needs no dependencies. It is also
      # the check that fails on a rule nobody implemented, which is the cheapest kind of
      # wrong to find out about first.
      - run: node scripts/check-spec.mjs

      # Fires when a dependency bump widens the peer range that justifies an ignore —
      # which is exactly the commit where the answer changed.
      - run: node scripts/check-dependabot-ignores.mjs

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @wordbands/web lint

      - run: pnpm --filter @wordbands/web typecheck

      - run: pnpm --filter @wordbands/web test

      # No build step on purpose: Vercel builds every PR as a preview deployment, and
      # `next build` type-checks there. Running it here too would spend minutes for a
      # signal we already get.
